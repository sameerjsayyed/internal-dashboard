<div class="past-reports-panel">
  <mat-card-title>
    <mat-icon>folder</mat-icon>
    Past Reports
  </mat-card-title>

  <div class="reports-tabs">
    <mat-tab-group>
      <mat-tab label="Upload History">
        <div class="table-container">
          <div class="controls-section">
            <mat-form-field appearance="outline">
              <mat-label>Search</mat-label>
              <input matInput placeholder="Search files..." [(ngModel)]="searchTerm">
              <mat-icon matSuffix>search</mat-icon>
            </mat-form-field>
            
            <button mat-raised-button color="primary" (click)="clearAll()">
              <mat-icon>delete_sweep</mat-icon>
              Clear All
            </button>
          </div>

                    <table mat-table [dataSource]="filteredDataSource" class="mat-elevation-z1">
            <ng-container matColumnDef="file_name">
              <th mat-header-cell *matHeaderCellDef (click)="sortTableColumn('file_name')" class="sortable">
                <div class="header-content">
                  <span class="header-text">File Name</span>
                  <mat-icon class="sort-icon" [class.sorted]="currentSortColumn === 'file_name'">
                    {{ getSortIcon('file_name') }}
                  </mat-icon>
                </div>
              </th>
              <td mat-cell *matCellDef="let row">{{ row.file_name }}</td>
            </ng-container>

            <ng-container matColumnDef="file_size_kb">
              <th mat-header-cell *matHeaderCellDef (click)="sortTableColumn('file_size_kb')" class="sortable">
                <div class="header-content">
                  <span class="header-text">Size</span>
                  <mat-icon class="sort-icon" [class.sorted]="currentSortColumn === 'file_size_kb'">
                    {{ getSortIcon('file_size_kb') }}
                  </mat-icon>
                </div>
              </th>
              <td mat-cell *matCellDef="let row">{{ row.file_size_kb }} KB</td>
            </ng-container>

            <ng-container matColumnDef="uploaded_at">
              <th mat-header-cell *matHeaderCellDef (click)="sortTableColumn('uploaded_at')" class="sortable">
                <div class="header-content">
                  <span class="header-text">Date</span>
                  <mat-icon class="sort-icon" [class.sorted]="currentSortColumn === 'uploaded_at'">
                    {{ getSortIcon('uploaded_at') }}
                  </mat-icon>
                </div>
              </th>
              <td mat-cell *matCellDef="let row">
                {{ row.uploaded_at | date : "MMM dd, yyyy, h:mm:ss a" }}
              </td>
            </ng-container>

            <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef></th>
              <td mat-cell *matCellDef="let row">
                <button class="delete-btn" (click)="deleteOne(row.id)">
                  <mat-icon>delete</mat-icon>
                </button>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>

          <div class="no-data" *ngIf="filteredDataSource.length === 0">
            <mat-icon>folder_open</mat-icon>
            <p>No past uploads found.</p>
          </div>
        </div>
      </mat-tab>
    </mat-tab-group>
  </div>
</div>
