<mat-card class="past-reports mat-elevation-z2">
  <mat-card-title>
    📂 Past Reports
    <button mat-stroked-button color="warn" (click)="clearAll()" style="float: right">
      <mat-icon>delete_sweep</mat-icon>
      Clear All
    </button>
  </mat-card-title>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z1" *ngIf="dataSource.length; else noData">
    <ng-container matColumnDef="file_name">
      <th mat-header-cell *matHeaderCellDef>File Name</th>
      <td mat-cell *matCellDef="let row">{{ row.file_name }}</td>
    </ng-container>

    <ng-container matColumnDef="file_size_kb">
      <th mat-header-cell *matHeaderCellDef>Size</th>
      <td mat-cell *matCellDef="let row">{{ row.file_size_kb }} KB</td>
    </ng-container>

    <ng-container matColumnDef="uploaded_at">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let row">
        {{ row.uploaded_at | date : "medium" }}
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button color="warn" (click)="deleteOne(row.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <ng-template #noData>
    <p style="margin-top: 1rem">No past uploads found.</p>
  </ng-template>
</mat-card>
