<mat-card class="upload-card mat-elevation-z2">
  <mat-card-title>📤 Upload Time Booking Report</mat-card-title>
  <mat-card-content>
    <!-- Drop zone -->
    <div class="upload-zone dropzone" [class.dropzone-hover]="dragOver" [class.dropzone-disabled]="uploading"
      (drop)="!uploading && handleDrop($event)" (dragover)="!uploading && handleDragOver($event)"
      (dragleave)="!uploading && handleDragLeave($event)">
      <ng-container *ngIf="!uploading; else uploadingSpinner">
        <p>Drag & drop your .xls file here, or click to select</p>
        <input type="file" accept=".xls, .xlsx" (change)="onFileChange($event)" />
      </ng-container>
      <ng-template #uploadingSpinner>
        <mat-progress-spinner diameter="40" mode="indeterminate" color="accent"></mat-progress-spinner>
        <p>Uploading…</p>
      </ng-template>
    </div>

    <mat-progress-bar *ngIf="uploading" mode="determinate" [value]="uploadProgress" color="primary"></mat-progress-bar>

    <button mat-raised-button color="primary" (click)="upload()" [disabled]="!file">
      <mat-icon>cloud_upload</mat-icon>
      Upload & Generate
    </button>
  </mat-card-content>
</mat-card>

<div *ngIf="latestUpload" class="upload-info">
  <mat-icon>description</mat-icon>
  <strong>{{ latestUpload.file_name }}</strong>
  <span>Uploaded on: {{ latestUpload.uploaded_at | date : "medium" }}</span>
</div>

<app-reports *ngIf="reports" [data]="reports"></app-reports>
