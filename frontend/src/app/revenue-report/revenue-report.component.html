<div class="revenue-panel">
  <mat-card-title>
    <mat-icon>attach_money</mat-icon>
    Revenue Report
  </mat-card-title>

  <div class="revenue-tabs">
    <mat-tab-group>
      <mat-tab label="Task Wise">
        <app-report-table [data]="taskWiseData"></app-report-table>
      </mat-tab>
      <mat-tab label="Contract Wise">
        <app-report-table [data]="contractWiseData"></app-report-table>
      </mat-tab>
      <mat-tab label="Month Wise">
        <app-report-table [data]="monthWiseData"></app-report-table>
      </mat-tab>
      <mat-tab label="Quarterly">
        <app-report-table [data]="quarterlyData"></app-report-table>
      </mat-tab>
    </mat-tab-group>
  </div>
</div>
