<mat-card class="rph-panel mat-elevation-z2">
  <mat-card-title>💰 RPH Maintenance</mat-card-title>

  <!-- Download Template Above Upload -->
  <div class="header-actions">
    <button mat-stroked-button color="primary" (click)="downloadTemplate()">
      <mat-icon>download</mat-icon> Download Template
    </button>
  </div>

  <!-- Upload Dropzone -->
  <div class="dropzone" (drop)="onFileDrop($event)" (dragover)="onDragOver($event)" (dragleave)="onDragLeave($event)"
    [class.hovered]="dragOver">
    <p>
      📥 Drag & drop Excel file here or
      <span class="browse" (click)="fileInput?.click()">browse</span>
    </p>
    <input #fileInput type="file" hidden (change)="handleFileUpload($event)" accept=".xls,.xlsx" />
  </div>

  <!-- Top Right Actions -->
  <div class="table-actions">
    <button mat-stroked-button color="primary" (click)="saveAll()">
      <mat-icon>save</mat-icon> Save All
    </button>

            <button mat-stroked-button (click)="downloadExcel()">
          <mat-icon>table_chart</mat-icon> Export
        </button>
  </div>

  <!-- Modern RPH Table -->
  <div class="table-container" *ngIf="rows.length">
    <table mat-table [dataSource]="rows.controls" class="modern-table">
      <!-- Contract Code -->
      <ng-container matColumnDef="contract_code">
        <th mat-header-cell *matHeaderCellDef>
          <div class="header-content">
            <mat-icon>code</mat-icon>
            <span>Contract Code</span>
          </div>
        </th>
        <td mat-cell *matCellDef="let row">
          <div class="cell-content">
            <mat-form-field appearance="outline" class="compact-field">
              <input matInput [formControl]="row.get('contract_code')" placeholder="Enter code" />
            </mat-form-field>
            <mat-icon *ngIf="highlightMap.get(row)" class="edited-icon">edit</mat-icon>
          </div>
        </td>
      </ng-container>

      <!-- Contract Name -->
      <ng-container matColumnDef="contract_name">
        <th mat-header-cell *matHeaderCellDef>
          <div class="header-content">
            <mat-icon>business</mat-icon>
            <span>Contract Name</span>
          </div>
        </th>
        <td mat-cell *matCellDef="let row">
          <div class="cell-content">
            <mat-form-field appearance="outline" class="compact-field">
              <input matInput [formControl]="row.get('contract_name')" placeholder="Enter name" />
            </mat-form-field>
            <mat-icon *ngIf="highlightMap.get(row)" class="edited-icon">edit</mat-icon>
          </div>
        </td>
      </ng-container>

      <!-- Task Code -->
      <ng-container matColumnDef="task_code">
        <th mat-header-cell *matHeaderCellDef>
          <div class="header-content">
            <mat-icon>assignment</mat-icon>
            <span>Task Code</span>
          </div>
        </th>
        <td mat-cell *matCellDef="let row">
          <div class="cell-content">
            <mat-form-field appearance="outline" class="compact-field">
              <input matInput [formControl]="row.get('task_code')" placeholder="Enter task code" />
            </mat-form-field>
            <mat-icon *ngIf="highlightMap.get(row)" class="edited-icon">edit</mat-icon>
          </div>
        </td>
      </ng-container>

      <!-- RPH -->
      <ng-container matColumnDef="rph">
        <th mat-header-cell *matHeaderCellDef>
          <div class="header-content">
            <mat-icon>attach_money</mat-icon>
            <span>RPH</span>
          </div>
        </th>
        <td mat-cell *matCellDef="let row">
          <div class="cell-content">
            <mat-form-field appearance="outline" class="compact-field">
              <input matInput type="number" [formControl]="row.get('rph')" placeholder="0.00" />
            </mat-form-field>
            <mat-icon *ngIf="highlightMap.get(row)" class="edited-icon">edit</mat-icon>
          </div>
        </td>
      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>
          <div class="header-content">
            <mat-icon>settings</mat-icon>
            <span>Actions</span>
          </div>
        </th>
        <td mat-cell *matCellDef="let row; let i = index">
          <div class="action-buttons">
            <button mat-icon-button color="warn" (click)="removeRow(i)" matTooltip="Delete row">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <!-- Table Rows -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns" 
          [class.highlighted]="highlightMap.get(row)"
          [class.modified]="highlightMap.get(row)"></tr>
    </table>
  </div>

  <!-- Add Row Below Table -->
  <div class="footer-add-row">
    <button mat-raised-button color="accent" (click)="addRow()">
      <mat-icon>add</mat-icon> Add New Row
    </button>
  </div>
</mat-card>
